{{- /* Rendered only after repoId and categoryId are filled in hugo.toml */}}
{{- with site.Params.giscus }}
{{- if and .repoId .categoryId }}
<section class="comments" aria-labelledby="comments-title">
  <h2 id="comments-title">{{ i18n "comments" }}</h2>
  <div class="giscus"></div>
  {{- /* Loaded from script so the frame starts on the page's current theme */}}
  <script>
    (function () {
      var theme = document.documentElement.dataset.theme ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var attrs = {
        "data-repo": {{ .repo }},
        "data-repo-id": {{ .repoId }},
        "data-category": {{ .category }},
        "data-category-id": {{ .categoryId }},
        "data-mapping": {{ .mapping | default "pathname" }},
        "data-strict": "1",
        "data-reactions-enabled": "1",
        "data-emit-metadata": "0",
        "data-input-position": "top",
        "data-theme": theme,
        "data-lang": {{ site.Language.Lang }},
        "data-loading": "lazy",
        "crossorigin": "anonymous"
      };
      var s = document.createElement("script");
      s.src = "https://giscus.app/client.js";
      s.async = true;
      for (var k in attrs) s.setAttribute(k, attrs[k]);
      document.currentScript.after(s);
    })();
  </script>
</section>
{{- end }}
{{- end }}
